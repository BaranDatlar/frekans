<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Frekans</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<!-- Firebase SDK'sı CDN'den gelir; modüller sade "firebase/..." adıyla import eder ki
     aynı dosyalar Node altındaki uçtan uca testlerde de çalışsın. -->
<script type="importmap">
{
  "imports": {
    "firebase/app":      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
    "firebase/auth":     "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js"
  }
}
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
</head>
<body>

<div id="offline" class="offline-bar" hidden>Bağlantı yok — yeniden bağlanılıyor…</div>

<div id="app">

  <!-- ══════════════ AÇILIŞ ══════════════ -->
  <section class="screen" id="screen-home">
    <div class="stack center">
      <h1 class="logo">Frekans</h1>
      <p class="tagline">Aynı dalga boyunda mısınız?</p>

      <label class="field">
        <span>Adın</span>
        <input id="input-name" type="text" maxlength="14" placeholder="Baran" autocomplete="nickname">
      </label>

      <button class="btn primary" id="btn-create">Oda Kur</button>

      <div class="join-row">
        <input id="input-code" type="text" maxlength="4" placeholder="KOD" autocomplete="off"
               autocapitalize="characters" spellcheck="false" inputmode="text">
        <button class="btn" id="btn-join">Katıl</button>
      </div>

      <button class="btn ghost" id="btn-open-spectrums">Spektrumlar</button>
      <p class="hint" id="home-status"></p>
    </div>
  </section>

  <!-- ══════════════ LOBİ ══════════════ -->
  <section class="screen" id="screen-lobby">
    <header class="topbar">
      <button class="icon-btn" id="btn-leave-lobby" title="Çık">←</button>
      <span class="topbar-title">Lobi</span>
      <span class="spacer"></span>
    </header>

    <div class="stack">
      <div class="code-card">
        <span class="code-label">Oda kodu</span>
        <span class="code-value" id="lobby-code">····</span>
        <button class="btn small" id="btn-share">Bağlantıyı kopyala</button>
      </div>

      <h2 class="section-title">Oyuncular <span class="count" id="lobby-count"></span></h2>
      <ul class="player-list" id="lobby-players"></ul>

      <label class="field">
        <span>Tur sayısı <b id="rounds-value">10</b></span>
        <input id="input-rounds" type="range" min="3" max="20" step="1" value="10">
      </label>

      <button class="btn primary" id="btn-start">Oyunu Başlat</button>
      <button class="btn ghost small" id="btn-lobby-spectrums">Spektrumlar</button>
      <p class="hint" id="lobby-hint"></p>
    </div>
  </section>

  <!-- ══════════════ OYUN ══════════════ -->
  <section class="screen" id="screen-game">
    <header class="topbar">
      <button class="icon-btn" id="btn-leave-game" title="Çık">←</button>
      <span class="topbar-title" id="game-round-label">Tur 1/10</span>
      <span class="score-chip" id="game-score">0</span>
    </header>

    <div class="game-body">
      <div class="dial-wrap">
        <div class="dial" id="dial"></div>
        <div class="spectrum-labels">
          <span class="spec-left" id="spec-left">—</span>
          <span class="spec-right" id="spec-right">—</span>
        </div>
      </div>

      <div class="stage" id="stage"></div>
    </div>
  </section>

  <!-- ══════════════ OYUN SONU ══════════════ -->
  <section class="screen" id="screen-over">
    <header class="topbar">
      <button class="icon-btn" id="btn-leave-over" title="Çık">←</button>
      <span class="topbar-title">Sonuç</span>
      <span class="spacer"></span>
    </header>

    <div class="stack">
      <div class="verdict-card">
        <div class="verdict-score"><b id="over-total">0</b><span id="over-max">/40</span></div>
        <h2 id="over-title">—</h2>
        <p id="over-note"></p>
      </div>
      <h2 class="section-title">Turlar</h2>
      <ul class="history-list" id="over-history"></ul>
      <button class="btn primary" id="btn-again">Tekrar Oyna</button>
    </div>
  </section>

  <!-- ══════════════ SPEKTRUM EDİTÖRÜ ══════════════ -->
  <section class="screen" id="screen-spectrums">
    <header class="topbar">
      <button class="icon-btn" id="btn-close-spectrums" title="Geri">←</button>
      <span class="topbar-title">Spektrumlar <span class="count" id="spec-count"></span></span>
      <span class="spacer"></span>
    </header>

    <div class="stack">
      <form class="spec-form" id="spec-form">
        <input id="spec-in-left" type="text" maxlength="28" placeholder="Soğuk" required>
        <span class="arrows">↔</span>
        <input id="spec-in-right" type="text" maxlength="28" placeholder="Sıcak" required>
        <button class="btn small primary" type="submit">Ekle</button>
      </form>
      <p class="hint" id="spec-status"></p>

      <div class="row">
        <button class="btn small ghost" id="btn-spec-export">JSON indir</button>
        <button class="btn small ghost" id="btn-spec-import">JSON yükle</button>
        <input id="spec-file" type="file" accept="application/json,.json" hidden>
      </div>

      <input id="spec-search" class="search" type="search" placeholder="Ara…">
      <ul class="spec-list" id="spec-list"></ul>
    </div>
  </section>

  <!-- ══════════════ YÜKLENİYOR / HATA ══════════════ -->
  <section class="screen" id="screen-boot">
    <div class="stack center">
      <div class="spinner"></div>
      <p class="hint" id="boot-status">Bağlanılıyor…</p>
    </div>
  </section>

</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
